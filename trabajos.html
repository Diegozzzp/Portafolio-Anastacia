<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivo fotografico - Anastacia Mejias</title>
  <meta name="description" content="Archivo completo del portafolio fotografico de Anastacia Mejias con filtros y busqueda.">
  <meta name="theme-color" content="#f7f1e8">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tailwind-extras.css">
</head>
<body>
  <nav class="site-nav nav-light" aria-label="Navegacion principal">
    <a class="brand" href="index.html">Anastacia</a>
    <button class="menu-toggle" aria-label="Abrir menu"><span></span><span></span><span></span></button>
    <div class="nav-links">
      <a href="index.html#mirada">Mirada</a>
      <a href="index.html#series">Series</a>
      <a href="index.html#contacto">Contacto</a>
      <a class="nav-cta" href="index.html">Inicio</a>
    </div>
  </nav>
  <main class="section" style="padding-top: 8rem;">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="section-kicker">Archivo completo</p>
          <h1 class="section-title">Todas las fotografias</h1>
        </div>
        <p class="section-text">Una vista de exploracion para revisar el cuerpo completo del trabajo. Filtra por categoria, busca por titulo y abre cada foto en lightbox.</p>
      </div>
      <div class="toolbar">
        <div class="filters" id="filters" aria-label="Filtros de galeria"></div>
        <label class="search"><span class="skip-link">Buscar</span><input id="searchInput" type="search" placeholder="Buscar por serie o titulo..."></label>
      </div>
      <div class="gallery" id="gallery"></div>
      <div class="empty-state" id="emptyState">No encontre fotos con ese filtro.</div>
    </div>
  </main>
  <footer class="footer"><div class="container"><span>Anastacia Mejias - Archivo</span><span>&copy; <span id="year"></span></span></div></footer>
  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Vista ampliada de fotografia">
    <button class="icon-btn close-btn" id="lightboxClose" aria-label="Cerrar">X</button>
    <div class="lightbox-inner">
      <figure class="lightbox-figure"><img id="lightboxImage" src="" alt=""></figure>
      <aside class="lightbox-info">
        <p class="section-kicker" id="lightboxMeta"></p>
        <h3 id="lightboxTitle"></h3>
        <p id="lightboxStory"></p>
        <div class="lightbox-controls">
          <button class="icon-btn" id="lightboxPrev" aria-label="Anterior">&lt;</button>
          <button class="icon-btn" id="lightboxNext" aria-label="Siguiente">&gt;</button>
          <a class="btn ghost" id="lightboxOriginal" href="#" target="_blank" rel="noopener noreferrer">Original</a>
        </div>
      </aside>
    </div>
  </div>
  <script src="assets/js/portfolio-data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
